<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header text-white" style="background-color: #B22A95">
            <h5 class="mb-0"><i class="bi bi-person-workspace me-2"></i>Chat Profissional</h5>
        </div>

        <div class="card-body" id="chatMessages" style="height: 400px; overflow-y: auto;">
            <p class="text-muted text-center">Aguardando mensagens do estudante...</p>
        </div>

        <div class="card-footer">
            <div class="input-group">
                <input type="text" id="messageInput" class="form-control" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button class="btn" style="background-color: #B22A95; color: #fff" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS("http://localhost:8000/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            console.log("✅ Conectado ao WebSocket (Profissional)");

            stompClient.subscribe("/topic/mensagens", function (message) {
                const msg = JSON.parse(message.body);
                if (msg.from !== "profissional") {
                    showMessage(msg.from === "estudante" ? "estudante" : msg.from, msg.text, "received");
                }
            });
        });
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const message = input.value.trim();

        if (message !== "" && stompClient) {
            stompClient.send("/app/mensagemGlobal", {}, JSON.stringify({ from: "profissional", text: message }));
            showMessage("Você", message);
            input.value = "";
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }

    function showMessage(sender, text) {
        const chat = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = sender === "Você" ? "text-end mb-2" : "text-start mb-2";
        div.innerHTML = `<span class="badge ${sender === "Você" ? "bg-primary" : "bg-secondary"}">${sender}</span>
                       <div class="p-2 mt-1 bg-light border rounded">${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    connect();
</script>
</body>
</html>
