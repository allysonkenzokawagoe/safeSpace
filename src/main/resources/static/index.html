<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de WebSocket com DTO</title>
    <style>
        /* (O mesmo CSS de antes) */
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        #chat-container { width: 500px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        #messages { height: 300px; border: 1px solid #eee; margin-bottom: 10px; padding: 10px; overflow-y: auto; list-style-type: none; }
        #message-form { display: flex; flex-wrap: wrap; gap: 10px; }
        #name-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 150px; }
        #message-input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #send-button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        #send-button:disabled { background-color: #aaa; }
        .status { font-weight: bold; }
        .status.connected { color: green; }
        .status.disconnected { color: red; }
        .message-item .sender { font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<div id="chat-container">
    <h2>Chat Global com DTO</h2>
    <p>Status: <span id="status" class="status disconnected">Desconectado</span></p>

    <ul id="messages"></ul>

    <form id="message-form" onsubmit="sendMessage(event )">
        <input type="text" id="name-input" placeholder="Seu nome" autocomplete="off" required/>
        <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off" required/>
        <button id="send-button" type="submit" disabled>Enviar</button>
    </form>
</div>

<script>
    let stompClient = null;
    const statusElement = document.getElementById('status');
    const messagesElement = document.getElementById('messages');
    const sendButton = document.getElementById('send-button');
    const nameInput = document.getElementById('name-input');
    const messageInput = document.getElementById('message-input');

    function connect() {
        const socket = new SockJS('http://localhost:8000/ws' );
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Conectado: ' + frame);
            updateConnectionStatus(true);

            // Inscreve-se no tópico para receber mensagens
            stompClient.subscribe('/topic/mensagens', function (message) {
                // O corpo da mensagem agora é um JSON com 'from' e 'text'
                const chatMessage = JSON.parse(message.body);
                showMessage(chatMessage);
            });
        }, function(error) {
            console.error('Erro de conexão: ' + error);
            updateConnectionStatus(false);
            setTimeout(connect, 5000);
        });
    }

    function sendMessage(event) {
        event.preventDefault();
        const from = nameInput.value.trim();
        const text = messageInput.value.trim();

        if (text && from && stompClient) {
            // Cria o objeto que corresponde ao DTO ChatMessage do backend
            const chatMessage = {
                from: from,
                text: text
            };
            // Envia o objeto como uma string JSON
            stompClient.send("/app/mensagemGlobal", {}, JSON.stringify(chatMessage));
            messageInput.value = ''; // Limpa apenas o campo da mensagem
        }
    }

    function showMessage(message) {
        const messageItem = document.createElement('li');
        messageItem.classList.add('message-item');

        const senderElement = document.createElement('span');
        senderElement.classList.add('sender');
        senderElement.textContent = message.from + ': ';

        const textElement = document.createElement('span');
        textElement.textContent = message.text;

        messageItem.appendChild(senderElement);
        messageItem.appendChild(textElement);

        messagesElement.appendChild(messageItem);
        messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function updateConnectionStatus(isConnected) {
        sendButton.disabled = !isConnected;
        statusElement.textContent = isConnected ? 'Conectado' : 'Desconectado';
        statusElement.className = isConnected ? 'status connected' : 'status disconnected';
    }

    connect();
</script>

</body>
</html>
